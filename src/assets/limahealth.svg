<svg width="340" height="230" viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0b1330"/>
    </linearGradient>
    <pattern id="lhDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <linearGradient id="lhCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1b3d"/>
      <stop offset="100%" stop-color="#0b1330"/>
    </linearGradient>
  </defs>

  <rect width="340" height="230" fill="url(#lhBg)"/>
  <rect width="340" height="230" fill="url(#lhDots)"/>

  <!-- watch / wearable icon (safe zone starts x=55) -->
  <g transform="translate(55,22)" opacity="0.95">
    <rect x="10" y="4" width="20" height="9" rx="3" fill="#0b1330" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="0" y="12" width="40" height="40" rx="11" fill="#0f1b3d" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M20 21 v10 l7 5" fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10" y="51" width="20" height="9" rx="3" fill="#0b1330" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- risk-score card (ends x=285, within safe zone) -->
  <g transform="translate(150,20)">
    <rect width="135" height="104" rx="14" fill="url(#lhCard)" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="14" y="22" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7dd3fc" opacity="0.9">RISK SCORE</text>
    <polyline points="12,66 28,66 38,46 48,80 58,54 70,66 88,66 98,50 110,66 120,66"
      fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="54" r="3" fill="#22d3ee"/>
    <rect x="12" y="80" width="52" height="7" rx="3.5" fill="#134e6b"/>
    <rect x="12" y="80" width="34" height="7" rx="3.5" fill="#22d3ee"/>
    <circle cx="108" cy="84" r="9" fill="none" stroke="#22c55e" stroke-width="2.2"/>
    <path d="M104 84 l2.5 2.5 l5 -6" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="55" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Lima Health</text>
  <text x="55" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#bae6fd">Wearable data + AI risk scoring</text>

  <g transform="translate(55,186)">
    <rect width="90" height="20" rx="10" fill="#0b1330" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="45" y="14" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#7dd3fc" text-anchor="middle">HEALTHTECH</text>
  </g>
</svg>
