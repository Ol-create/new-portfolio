<svg width="340" height="230" viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#14102b"/>
    </linearGradient>
    <pattern id="tvDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <linearGradient id="tvCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1836"/>
      <stop offset="100%" stop-color="#14102b"/>
    </linearGradient>
  </defs>

  <rect width="340" height="230" fill="url(#tvBg)"/>
  <rect width="340" height="230" fill="url(#tvDots)"/>

  <!-- mic icon (safe zone starts x=55) -->
  <g transform="translate(55,22)" opacity="0.95">
    <rect x="9" y="0" width="18" height="30" rx="9" fill="#1d1836" stroke="#c4b5fd" stroke-width="2.2"/>
    <path d="M2 19 a16 16 0 0 0 32 0" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="18" y1="35" x2="18" y2="44" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="9" y1="44" x2="27" y2="44" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- waveform card (ends x=285, within safe zone) -->
  <g transform="translate(150,20)">
    <rect width="135" height="104" rx="14" fill="url(#tvCard)" stroke="#c4b5fd" stroke-opacity="0.35"/>
    <text x="14" y="22" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#c4b5fd" opacity="0.9">VOICE MATCH</text>
    <g transform="translate(14,34)" fill="#c4b5fd">
      <rect x="0" y="20" width="5" height="10" rx="2.5"/>
      <rect x="8" y="12" width="5" height="26" rx="2.5"/>
      <rect x="16" y="4" width="5" height="34" rx="2.5" fill="#e9d5ff"/>
      <rect x="24" y="16" width="5" height="18" rx="2.5"/>
      <rect x="32" y="8" width="5" height="26" rx="2.5"/>
      <rect x="40" y="18" width="5" height="14" rx="2.5"/>
      <rect x="48" y="2" width="5" height="34" rx="2.5" fill="#e9d5ff"/>
      <rect x="56" y="14" width="5" height="18" rx="2.5"/>
      <rect x="64" y="20" width="5" height="10" rx="2.5"/>
      <rect x="72" y="10" width="5" height="24" rx="2.5"/>
      <rect x="80" y="16" width="5" height="18" rx="2.5"/>
      <rect x="88" y="6" width="5" height="30" rx="2.5" fill="#e9d5ff"/>
      <rect x="96" y="18" width="5" height="14" rx="2.5"/>
      <rect x="104" y="12" width="5" height="24" rx="2.5"/>
    </g>
    <circle cx="112" cy="86" r="9" fill="none" stroke="#22c55e" stroke-width="2.2"/>
    <path d="M108 86 l2.5 2.5 l5 -6" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="55" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">TrueVoice</text>
  <text x="55" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e9d5ff">Biometric voice authentication</text>

  <g transform="translate(55,186)">
    <rect width="90" height="20" rx="10" fill="#1d1836" stroke="#c4b5fd" stroke-opacity="0.5"/>
    <text x="45" y="14" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">AI &amp; SECURITY</text>
  </g>
</svg>
