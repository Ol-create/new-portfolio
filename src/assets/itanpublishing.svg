<svg width="340" height="230" viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="igBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#241705"/>
    </linearGradient>
    <pattern id="igDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <linearGradient id="igCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2408"/>
      <stop offset="100%" stop-color="#241705"/>
    </linearGradient>
  </defs>

  <rect width="340" height="230" fill="url(#igBg)"/>
  <rect width="340" height="230" fill="url(#igDots)"/>

  <!-- user / KYC check icon (safe zone starts x=55) -->
  <g transform="translate(55,22)" opacity="0.95">
    <circle cx="22" cy="14" r="10" fill="none" stroke="#fcd34d" stroke-width="2.2"/>
    <path d="M4 44 C4 30 40 30 40 44" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round"/>
    <g transform="translate(26,34)">
      <circle cx="10" cy="10" r="11" fill="#241705" stroke="#22c55e" stroke-width="2"/>
      <path d="M5 10 l3.3 3.3 l7 -7.3" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- open book card (ends x=285, within safe zone) -->
  <g transform="translate(150,20)">
    <rect width="135" height="104" rx="14" fill="url(#igCard)" stroke="#fcd34d" stroke-opacity="0.35"/>
    <g transform="translate(28,26)">
      <path d="M35 5 C26 0 13 0 3 3.5 V52 C13 48.5 26 48.5 35 53 Z" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linejoin="round"/>
      <path d="M35 5 C44 0 57 0 67 3.5 V52 C57 48.5 44 48.5 35 53 Z" fill="none" stroke="#fde68a" stroke-width="2" stroke-linejoin="round"/>
      <line x1="10" y1="14" x2="27" y2="12" stroke="#fcd34d" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="10" y1="23" x2="27" y2="21" stroke="#fcd34d" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
      <line x1="10" y1="32" x2="25" y2="30" stroke="#fcd34d" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
      <line x1="43" y1="12" x2="60" y2="14" stroke="#fde68a" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="43" y1="21" x2="60" y2="23" stroke="#fde68a" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
      <line x1="43" y1="30" x2="58" y2="32" stroke="#fde68a" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>

  <text x="55" y="140" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Itan Global</text>
  <text x="55" y="164" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Publishing</text>
  <text x="55" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fde68a">Author, Reader &amp; Admin apps</text>

  <g transform="translate(55,198)">
    <rect width="90" height="20" rx="10" fill="#241705" stroke="#fcd34d" stroke-opacity="0.5"/>
    <text x="45" y="14" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#fde68a" text-anchor="middle">PUBLISHING</text>
  </g>
</svg>
