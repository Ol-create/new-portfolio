<svg width="340" height="230" viewBox="0 0 340 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#1c1207"/>
    </linearGradient>
    <pattern id="ldDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <linearGradient id="ldCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2308"/>
      <stop offset="100%" stop-color="#1c1207"/>
    </linearGradient>
  </defs>

  <rect width="340" height="230" fill="url(#ldBg)"/>
  <rect width="340" height="230" fill="url(#ldDots)"/>

  <!-- stitched leather patch icon (safe zone starts x=55) -->
  <g transform="translate(55,24)" opacity="0.95">
    <rect x="0" y="0" width="46" height="46" rx="8" fill="#1c1207" stroke="#f5cb87" stroke-width="2"/>
    <rect x="6" y="6" width="34" height="34" rx="4" fill="none" stroke="#f5cb87" stroke-width="1.4" stroke-dasharray="3 3"/>
    <path d="M14 30 L20 18 L26 26 L32 14" fill="none" stroke="#f5cb87" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- escrow / secure payment card (ends x=285, within safe zone) -->
  <g transform="translate(150,20)">
    <rect width="135" height="104" rx="14" fill="url(#ldCard)" stroke="#f5cb87" stroke-opacity="0.35"/>
    <text x="14" y="22" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#f5cb87" opacity="0.9">ESCROW</text>
    <g transform="translate(44,38)">
      <path d="M23 0 L44 8 V26 C44 42 34 52 23 58 C12 52 2 42 2 26 V8 Z" fill="none" stroke="#f5cb87" stroke-width="2.2"/>
      <path d="M13 29 l7 7 l14 -16" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="55" y="150" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Leddar</text>
  <text x="55" y="172" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fde8c9">Brand-artisan leather marketplace</text>

  <g transform="translate(55,186)">
    <rect width="102" height="20" rx="10" fill="#1c1207" stroke="#f5cb87" stroke-opacity="0.5"/>
    <text x="51" y="14" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#fde8c9" text-anchor="middle">MARKETPLACE</text>
  </g>
</svg>
